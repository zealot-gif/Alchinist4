name: Validate & Auto-Fix Hanzi Data

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-fix app.js data
        run: node autofix.js

      - name: Commit auto-fixed changes if any
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet || (git add app.js && git commit -m "chore: auto-fix stage recipes and duplicates" && git push)

      - name: Run stage & recipe validator
        run: node validate.js
